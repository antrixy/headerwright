<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- HeaderWright icon source.
       Concept: a list of headers, one being applied (the green one).
       Same green-means-active semantic as the badge, toggle, and dots.
       Grid designed on 128; bar geometry chosen to survive 16px. -->

  <!-- Dark field, rounded -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0d1117"/>

  <!-- Header lines: gray / green / gray, varied lengths like real values -->
  <rect x="24" y="34"   width="80" height="14" rx="7" fill="#9198a1"/>
  <rect x="24" y="57"   width="62" height="14" rx="7" fill="#3fb950"/>
  <rect x="24" y="80"   width="72" height="14" rx="7" fill="#6e7681"/>
</svg>
