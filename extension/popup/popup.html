<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HeaderWright</title>
<style>
  :root {
    --on: #1a7f37;        /* same green as the sw.js badge — one color, one meaning */
    --on-soft: #d4eadb;
    --off: #818b98;
    --ink: #24292f;
    --ink-soft: #57606a;
    --line: #d8dee4;
    --surface: #ffffff;
    --surface-2: #f6f8fa;
    --danger: #a40e26;
    --danger-soft: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --on: #3fb950;
      --on-soft: #12261a;
      --off: #6e7681;
      --ink: #e6edf3;
      --ink-soft: #9198a1;
      --line: #30363d;
      --surface: #161b22;
      --surface-2: #0d1117;
      --danger: #f85149;
      --danger-soft: #2d1214;
    }
  }

  * { box-sizing: border-box; }
  /* FINDING-022, NARROW FIX ONLY. The master toggle and the status line are
     the two load-bearing surfaces in this popup — the primary control and the
     honesty readout findings 3 and 8 exist to protect — and both left the
     viewport once the list overflowed. OBS-D12 measured that at THREE
     profiles on v0.1.5, not six, because each collision marker costs ~110px.

     THE FIX IS CONTAINMENT, NOT ADDITION. The popup becomes a flex column
     with a bounded height and the LIST scrolls between a fixed header and a
     fixed footer. It consumes no extra vertical space, adds no chrome, and
     introduces no new element — which is the constraint the roadmap sets on
     it, because v0.2.0's two-list card redesign has to be able to REPLACE
     this cleanly rather than unpick it.

     EXPLICITLY NOT FIXED HERE: the broad "scale to many complex entries"
     question. That is coupled to the card shape and is co-designed with
     response headers in v0.2.0.

     THE CAP IS A PLAIN 600px, AND THE REASON IS MEASURED. It was briefly
     `min(600px, 100vh)`, on the reasoning that a short display sizes the popup
     below Chrome's ceiling and a body taller than its own viewport would
     scroll bodily, reinstating this bug. That reasoning contained an error
     that the first browser open caught (OBS-E1):

       innerHeight 107 · body max-height "107px" · main 22px · content 141px

     `vh` IS CIRCULAR IN A POPUP THAT SIZES TO ITS CONTENT. The viewport is
     derived from the body height, the body height was capped by `100vh`, and
     `min()` takes the SMALLER term — so a small viewport produced a smaller
     cap, which produced a smaller viewport. It collapsed to 107px and clipped
     everything below the first two pixels of the empty-state box, including
     Add profile. The popup was unusable at ZERO profiles.

     The comment this replaces claimed that if `100vh` were dishonest "600px
     still binds". That is false for `min()` and was never measured. Do not
     reintroduce a viewport unit here; the selftest pins its absence.

     THE LIMIT THAT MOTIVATED `100vh` IS NOT KNOWN TO EXIST. The worry was that
     a short display sizes the popup below Chrome's ceiling, letting the body
     exceed its own viewport. Sitting E tried to produce it: the Chrome window
     was reduced to roughly 380px tall and the popup still reported a 600px
     viewport, because CHROME SIZES AN ACTION POPUP INDEPENDENTLY OF THE PARENT
     WINDOW — it is an overlay, not a constrained child. So the condition may
     need an actual short display, and may not be reachable at all. It is
     recorded as untested rather than as a known defect; claiming a limit
     nobody has reproduced would be the same overclaiming the comment above
     replaced. */
  body {
    width: 380px;
    max-height: 600px;
    display: flex;
    flex-direction: column;
    margin: 0;
    color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface);
  }
  code, .mono, input.mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
  }

  /* Top bar. flex: none so it keeps its height when the column is bounded —
     without it the header is a shrinkable flex item and the toggle would be
     squeezed rather than the list scrolled. */
  header {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  header h1 {
    font-size: 14px; font-weight: 650; margin: 0;
    letter-spacing: -0.01em;
  }
  header h1 .wright { color: var(--ink-soft); font-weight: 500; }

  /* Master toggle */
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; }
  .toggle .track {
    width: 34px; height: 18px; border-radius: 9px;
    background: var(--off); position: relative; transition: background .15s;
  }
  .toggle .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    transition: left .15s;
  }
  .toggle input:checked + .track { background: var(--on); }
  .toggle input:checked + .track::after { left: 18px; }
  .toggle input:focus-visible + .track { outline: 2px solid var(--ink); outline-offset: 2px; }
  .toggle .state {
    font-size: 11px; font-weight: 600; color: var(--ink-soft);
    min-width: 22px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .toggle input:checked ~ .state { color: var(--on); }

  /* The one scrolling region. min-height: 0 is required and is the whole
     trick: a flex item's default min-height is `auto`, which refuses to
     shrink below its content, so overflow-y would never engage and the body
     would grow past its own max-height exactly as before. */
  main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 16px 10px;
    background: var(--surface);
  }

  /* Profile list */
  .profile {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
    background: var(--surface-2);
  }
  .profile .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .profile .name { font-weight: 600; }
  .profile .meta { color: var(--ink-soft); font-size: 12px; margin-top: 1px; }
  .profile .domains { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
  .domain {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 8px;
  }
  /* FINDING-021's per-profile marker. Danger register rather than the neutral
     .notice one, because unlike the migration notice this is not "something
     changed, act when you can" — the profile is NOT applying right now, and
     the card's green dots would otherwise say the opposite. Sits at the bottom
     of the card, after the domain chips, so the chips it contradicts are read
     first. */
  .profile .collision {
    color: var(--danger); background: var(--danger-soft);
    font-size: 12px; line-height: 1.35; margin-top: 7px;
    border-radius: 5px; padding: 6px 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.granted { background: var(--on); box-shadow: 0 0 0 3px var(--on-soft); }
  /* A domain carrying a pre-0.1.4 grant. Deliberately NOT a third dot colour:
     the dot answers "do headers apply here", and the answer is no, same as
     any other ungranted domain. The dashed underline marks WHY without
     weakening what the dot means. Existing tokens only. */
  button.domain.migrating { border-style: solid; text-decoration: underline dashed var(--ink-soft); text-underline-offset: 2px; }
  /* Ungranted chips are buttons (finding 2). Reset the UA button styling the
     .domain rule does not cover, then add the affordance: a dashed border
     says "this one is actionable" without shouting, and distinguishes it from
     the solid border of a granted, non-interactive chip. */
  button.domain {
    font: inherit; color: inherit; cursor: pointer;
    border-style: dashed;
  }
  button.domain:hover { border-color: var(--ink-soft); background: var(--surface-2); }
  button.domain:focus-visible { outline: 2px solid var(--on); outline-offset: 1px; }
  .profile .actions { display: flex; gap: 2px; }

  /* Buttons */
  button {
    font: inherit; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 4px 10px;
  }
  button:hover { background: var(--surface-2); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  button.primary { background: var(--on); border-color: var(--on); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); background: var(--on); }
  button.quiet { border-color: transparent; background: none; color: var(--ink-soft); padding: 4px 6px; }
  button.quiet:hover { color: var(--ink); background: var(--surface-2); }
  button.danger-quiet { border-color: transparent; background: none; color: var(--danger); padding: 4px 6px; }
  button.danger-quiet:hover { background: var(--danger-soft); }
  /* The confirm's own Delete. Solid rather than quiet: this is the button that
     actually destroys something, and it should not look like the one that only
     asks. Reuses the existing danger token — no new colour. */
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.danger:hover { filter: brightness(1.08); background: var(--danger); }
  .add-bar {
    margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .io { display: flex; gap: 2px; }

  /* Import and delete confirmations */
  .confirm {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-top: 8px;
    background: var(--surface-2);
  }
  .confirm .form-actions { margin-top: 8px; }

  /* Empty state */
  .empty {
    border: 1px dashed var(--line); border-radius: 8px;
    padding: 20px 14px; text-align: center; color: var(--ink-soft);
    background: var(--surface-2);
  }

  /* Editor form */
  form {
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    background: var(--surface-2);
  }
  form h2 { font-size: 13px; margin: 0 0 10px; font-weight: 650; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 9px 0 3px; }
  input[type="text"], select {
    font: inherit; width: 100%; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 5px;
    color: var(--ink); background: var(--surface);
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.7; }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--on); outline-offset: 0; border-color: transparent; }
  .hint { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .hrow { display: grid; grid-template-columns: 1fr 82px 1fr 24px; gap: 5px; margin-bottom: 5px; }
  .hrow select { width: 82px; padding: 5px 3px; }
  .hrow .remove-row { border: none; background: none; color: var(--ink-soft); font-size: 15px; padding: 0; }
  .hrow .remove-row:hover { color: var(--danger); background: none; }
  input:disabled { opacity: 0.45; }

  .error { color: var(--danger); font-size: 12px; margin-top: 6px; }
  /* Neutral counterpart to .error, for a message that reports a SUCCESS the
     user should nonetheless know something about. #io-msg is shared between
     import rejections and the export notice, and a red line after a
     successful export reads as a failure. Existing tokens only, no new
     colour — same approach as the sync-failed footer. */
  .notice {
    color: var(--ink-soft); font-size: 12px; margin-top: 6px;
    border-left: 2px solid var(--line); padding-left: 8px;
  }
  /* The migration notice sits ABOVE the list rather than below an action, so
     it needs the margin on the other side. Same class otherwise: this is the
     same register as the export notice — a neutral thing the user should
     know, not an error. */
  #migration-notice { margin-top: 0; margin-bottom: 10px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
  .hidden { display: none; }

  /* Status line — the one-glance answer to "what is applying right now".
     flex: none for the same reason as the header: it is pinned, not shrunk. */
  footer {
    flex: none;
    padding: 7px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-soft);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
  }
  /* Sync failure. Uses the existing danger tokens rather than introducing a
     new colour: this is the same class of thing as an import rejection, and
     it should read that way. */
  footer.sync-failed {
    color: var(--danger);
    background: var(--danger-soft);
  }
</style>
</head>
<body>
  <header>
    <h1>Header<span class="wright">Wright</span></h1>
    <label class="toggle" title="Apply all profiles on or off">
      <input type="checkbox" id="master-toggle">
      <span class="track"></span>
      <span class="state" id="toggle-state">Off</span>
    </label>
  </header>

  <main>
    <div id="list-view">
      <!-- Finding 18 upgrade path. Outside #profile-list, which renderListNow
           clears on every render (finding 8). Hidden unless a domain is
           actually carrying a pre-0.1.4 grant, so it disappears for good once
           the last one is re-approved and never renders on a fresh install. -->
      <div id="migration-notice" class="notice hidden"></div>
      <div id="profile-list"></div>
      <div id="empty" class="empty hidden">
        No profiles yet. Add one to start setting headers on a site.
      </div>
      <div class="add-bar">
        <button id="add-profile" class="primary">Add profile</button>
        <span class="io">
          <button id="export-profiles" class="quiet">Export</button>
          <button id="import-profiles" class="quiet">Import</button>
        </span>
        <input type="file" id="import-file" accept=".json,application/json" class="hidden">
      </div>
      <div id="import-confirm" class="confirm hidden">
        <div id="import-confirm-text"></div>
        <div class="form-actions">
          <button type="button" id="import-cancel">Cancel</button>
          <button type="button" id="import-replace" class="primary">Replace</button>
        </div>
      </div>
      <div id="delete-confirm" class="confirm hidden">
        <div id="delete-confirm-text"></div>
        <div class="form-actions">
          <button type="button" id="delete-cancel">Cancel</button>
          <button type="button" id="delete-proceed" class="danger">Delete</button>
        </div>
      </div>
      <div id="io-msg" class="error hidden"></div>
    </div>

    <div id="edit-view" class="hidden">
      <form id="profile-form">
        <h2 id="form-title">New profile</h2>

        <label for="f-name">Profile name</label>
        <input type="text" id="f-name" autocomplete="off" placeholder="Local API auth">

        <label for="f-domains">Domains</label>
        <input type="text" id="f-domains" class="mono" autocomplete="off"
               placeholder="api.example.com, example.com">
        <div class="hint">Comma-separated. Subdomains of each domain match too.</div>

        <label>Headers</label>
        <div id="header-rows"></div>
        <button type="button" id="add-header-row" class="quiet">+ Add header</button>

        <div id="form-error" class="error hidden"></div>

        <div class="form-actions">
          <button type="button" id="f-cancel">Cancel</button>
          <button type="button" id="f-save" class="primary">Save profile</button>
        </div>
      </form>
    </div>
  </main>

  <footer id="status-line">&nbsp;</footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
